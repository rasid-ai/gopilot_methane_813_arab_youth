<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #070b1a; }
  text { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
  .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", monospace; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#12234a"/><stop offset="1" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13284a"/><stop offset="1" stop-color="#0c1a33"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcc4d" stop-opacity=".95"/><stop offset="1" stop-color="#ff5a36" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcc4d"/><stop offset="1" stop-color="#ff5a36" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7CFFCB"/>
    </marker>
  </defs>
  <rect width="1600" height="800" rx="28" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="80" cy="60" r="1.4"/><circle cx="210" cy="140" r="1"/><circle cx="330" cy="40" r="1.6"/>
    <circle cx="520" cy="90" r="1"/><circle cx="700" cy="30" r="1.3"/><circle cx="1010" cy="70" r="1"/>
    <circle cx="1180" cy="40" r="1.5"/><circle cx="1350" cy="110" r="1"/><circle cx="1530" cy="60" r="1.4"/>
    <circle cx="140" cy="700" r="1.2"/><circle cx="460" cy="760" r="1"/><circle cx="1120" cy="760" r="1.3"/>
    <circle cx="1480" cy="720" r="1"/><circle cx="60" cy="420" r="1"/><circle cx="1570" cy="400" r="1.2"/>
  </g>
  <text x="56" y="62" fill="#7CFFCB" font-size="20" letter-spacing="6" class="mono">GOPILOT · IN ONE PICTURE</text>

  <!-- ================= YOU ================= -->
  <g transform="translate(60,210)">
    <circle cx="70" cy="70" r="46" fill="#1d3b66" stroke="#7CFFCB" stroke-width="3"/>
    <circle cx="70" cy="56" r="17" fill="#cfe9ff"/>
    <path d="M38,104 Q70,70 102,104" fill="#cfe9ff"/>
    <text x="70" y="150" fill="#cfe9ff" font-size="22" text-anchor="middle" font-weight="bold">YOU</text>
    <!-- speech bubble -->
    <g transform="translate(-10,175)">
      <rect width="320" height="150" rx="18" fill="#f2fbf7"/>
      <path d="M60,0 L80,-22 L96,0 z" fill="#f2fbf7"/>
      <text x="22" y="44" fill="#0E3B2E" font-size="21">“Check this gas plant</text>
      <text x="22" y="74" fill="#0E3B2E" font-size="21">for methane on</text>
      <text x="22" y="104" fill="#0E3B2E" font-size="21">3 January 2024.”</text>
      <text x="22" y="134" fill="#008A6E" font-size="15" font-style="italic">plain language · no GIS · no code</text>
    </g>
  </g>
  <line x1="400" y1="430" x2="468" y2="430" stroke="#7CFFCB" stroke-width="4" marker-end="url(#arr)" stroke-dasharray="10 7"/>

  <!-- ================= ORBIT + ROBOT ================= -->
  <ellipse cx="800" cy="410" rx="300" ry="250" fill="none" stroke="#2a4a7b" stroke-width="2" stroke-dasharray="4 10"/>
  <g transform="translate(800,400)">
    <!-- thruster flames -->
    <path d="M-38,150 Q-30,215 -22,150 z" fill="url(#flame)" filter="url(#glow)"/>
    <path d="M22,150 Q30,215 38,150 z" fill="url(#flame)" filter="url(#glow)"/>
    <!-- antenna -->
    <line x1="0" y1="-150" x2="0" y2="-118" stroke="#7CFFCB" stroke-width="5"/>
    <circle cx="0" cy="-158" r="11" fill="#ffcc4d" filter="url(#glow)"/>
    <!-- head -->
    <rect x="-82" y="-120" width="164" height="112" rx="30" fill="#e9fff6" stroke="#00e0a4" stroke-width="5"/>
    <rect x="-62" y="-98" width="124" height="60" rx="18" fill="#0b1a2e"/>
    <circle cx="-26" cy="-68" r="13" fill="#59ff9c" filter="url(#glow)"/>
    <circle cx="26" cy="-68" r="13" fill="#59ff9c" filter="url(#glow)"/>
    <path d="M-22,-26 Q0,-12 22,-26" stroke="#0E3B2E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- ears -->
    <rect x="-96" y="-84" width="16" height="40" rx="6" fill="#00e0a4"/>
    <rect x="80" y="-84" width="16" height="40" rx="6" fill="#00e0a4"/>
    <!-- body -->
    <rect x="-70" y="2" width="140" height="146" rx="26" fill="#e9fff6" stroke="#00e0a4" stroke-width="5"/>
    <rect x="-44" y="26" width="88" height="54" rx="10" fill="#0E3B2E"/>
    <text x="0" y="62" fill="#7CFFCB" font-size="22" text-anchor="middle" font-weight="bold" class="mono">GO</text>
    <circle cx="-24" cy="110" r="9" fill="#ffcc4d"/><circle cx="0" cy="110" r="9" fill="#ff5a36"/><circle cx="24" cy="110" r="9" fill="#59ff9c"/>
    <!-- arms -->
    <path d="M-70,40 Q-120,60 -138,20" stroke="#e9fff6" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M70,40 Q120,60 138,20" stroke="#e9fff6" stroke-width="16" fill="none" stroke-linecap="round"/>
    <!-- wrench (left hand) -->
    <g transform="translate(-146,4) rotate(-30)">
      <rect x="-5" y="-6" width="10" height="44" rx="4" fill="#ffcc4d"/>
      <path d="M-14,-18 a14,14 0 1,0 28,0 l-7,0 l0,7 l-14,0 l0,-7 z" fill="#ffcc4d"/>
    </g>
    <!-- mini satellite (right hand) -->
    <g transform="translate(150,4) rotate(20)">
      <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#cfe9ff"/>
      <rect x="-40" y="-6" width="26" height="12" fill="#3aa0ff"/>
      <rect x="14" y="-6" width="26" height="12" fill="#3aa0ff"/>
    </g>
    <text x="0" y="200" fill="#ffcc4d" font-size="26" text-anchor="middle" font-weight="bold" letter-spacing="3" class="mono">GoPilot</text>
  </g>

  <!-- ================= TOOL CARDS ================= -->
  <!-- satellites -->
  <g transform="translate(470,120)">
    <rect width="250" height="128" rx="16" fill="url(#card)" stroke="#3aa0ff" stroke-width="2"/>
    <g transform="translate(48,40)">
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#cfe9ff"/>
      <rect x="-34" y="-6" width="20" height="12" fill="#3aa0ff"/><rect x="14" y="-6" width="20" height="12" fill="#3aa0ff"/>
    </g>
    <text x="88" y="46" fill="#3aa0ff" font-size="19" font-weight="bold" class="mono">SATELLITES</text>
    <text x="20" y="82" fill="#cfe9ff" font-size="16">Sentinel-2 · Landsat · SAR</text>
    <text x="20" y="106" fill="#cfe9ff" font-size="16">EnMAP · Tanager · <tspan fill="#ffcc4d" font-weight="bold">813</tspan></text>
  </g>
  <!-- AI models -->
  <g transform="translate(880,120)">
    <rect width="250" height="128" rx="16" fill="url(#card)" stroke="#ff5a9e" stroke-width="2"/>
    <g transform="translate(36,40)" fill="none" stroke="#ff5a9e" stroke-width="3">
      <rect x="-13" y="-13" width="26" height="26" rx="4"/>
      <line x1="-6" y1="-20" x2="-6" y2="-13"/><line x1="6" y1="-20" x2="6" y2="-13"/>
      <line x1="-6" y1="13" x2="-6" y2="20"/><line x1="6" y1="13" x2="6" y2="20"/>
    </g>
    <text x="80" y="46" fill="#ff5a9e" font-size="19" font-weight="bold" class="mono">AI MODELS</text>
    <text x="20" y="82" fill="#cfe9ff" font-size="16"><tspan fill="#ffcc4d" font-weight="bold">MethaneMapper</tspan> · fields</text>
    <text x="20" y="106" fill="#cfe9ff" font-size="16">palms · solar · 105+ more</text>
  </g>
  <!-- geo tools -->
  <g transform="translate(470,560)">
    <rect width="250" height="128" rx="16" fill="url(#card)" stroke="#59ff9c" stroke-width="2"/>
    <g transform="translate(36,40)">
      <rect x="-16" y="-8" width="32" height="22" rx="4" fill="#59ff9c"/>
      <rect x="-7" y="-16" width="14" height="10" rx="3" fill="none" stroke="#59ff9c" stroke-width="3"/>
    </g>
    <text x="80" y="46" fill="#59ff9c" font-size="19" font-weight="bold" class="mono">GEO TOOLS</text>
    <text x="20" y="82" fill="#cfe9ff" font-size="16">clip · indices · vectorize</text>
    <text x="20" y="106" fill="#cfe9ff" font-size="16">93 tools, chained for you</text>
  </g>
  <!-- data -->
  <g transform="translate(880,560)">
    <rect width="250" height="128" rx="16" fill="url(#card)" stroke="#ffcc4d" stroke-width="2"/>
    <g transform="translate(36,40)" fill="#ffcc4d">
      <ellipse cx="0" cy="-12" rx="16" ry="6"/>
      <rect x="-16" y="-12" width="32" height="26"/>
      <ellipse cx="0" cy="14" rx="16" ry="6"/>
      <ellipse cx="0" cy="-12" rx="16" ry="6" fill="#ffe08a"/>
    </g>
    <text x="80" y="46" fill="#ffcc4d" font-size="19" font-weight="bold" class="mono">DATA</text>
    <text x="20" y="82" fill="#cfe9ff" font-size="16">8,500+ datasets</text>
    <text x="20" y="106" fill="#cfe9ff" font-size="16">climate · DEM · buildings</text>
  </g>

  <line x1="1130" y1="430" x2="1198" y2="430" stroke="#7CFFCB" stroke-width="4" marker-end="url(#arr)" stroke-dasharray="10 7"/>

  <!-- ================= ANSWER ================= -->
  <g transform="translate(1210,190)">
    <text x="165" y="0" fill="#cfe9ff" font-size="22" text-anchor="middle" font-weight="bold">YOUR ANSWER</text>
    <rect x="0" y="20" width="330" height="250" rx="18" fill="#c9a87a" stroke="#7CFFCB" stroke-width="3"/>
    <!-- desert texture -->
    <g opacity=".35" stroke="#8a6a44" stroke-width="2" fill="none">
      <path d="M0,90 Q80,60 160,95 T330,80"/><path d="M0,170 Q90,140 180,175 T330,160"/>
      <path d="M0,230 Q100,210 200,236 T330,224"/>
    </g>
    <!-- facility -->
    <g fill="#5d5d5d"><rect x="70" y="150" width="28" height="18"/><rect x="104" y="142" width="18" height="26"/>
      <circle cx="80" cy="132" r="9" fill="#7a7a7a"/></g>
    <!-- plume -->
    <path d="M110,146 C150,120 210,110 300,98 C250,128 190,150 112,160 z" fill="url(#plume)"/>
    <circle cx="112" cy="152" r="7" fill="#ff5a36" stroke="#fff" stroke-width="2"/>
    <rect x="16" y="34" width="150" height="34" rx="8" fill="#0b1a2e" opacity=".85"/>
    <text x="28" y="57" fill="#ffcc4d" font-size="17" font-weight="bold" class="mono">PLUME FOUND</text>
    <rect x="16" y="216" width="298" height="40" rx="8" fill="#0b1a2e" opacity=".85"/>
    <text x="30" y="242" fill="#cfe9ff" font-size="16">map layers · plume size · note</text>
    <text x="165" y="306" fill="#9fb8d6" font-size="16" text-anchor="middle">in minutes, ready for GIS</text>
  </g>

  <!-- ================= STEPS ================= -->
  <g transform="translate(270,745)" class="mono" font-size="20" font-weight="bold">
    <text x="0" y="0" fill="#7CFFCB">1 ASK</text>
    <text x="150" y="0" fill="#2a4a7b">━━▶</text>
    <text x="245" y="0" fill="#3aa0ff">2 PLAN</text>
    <text x="405" y="0" fill="#2a4a7b">━━▶</text>
    <text x="500" y="0" fill="#ff5a9e">3 ACT · call tools &amp; models</text>
    <text x="860" y="0" fill="#2a4a7b">━━▶</text>
    <text x="955" y="0" fill="#ffcc4d">4 ANSWER · map</text>
  </g>
</svg>
</body></html>
